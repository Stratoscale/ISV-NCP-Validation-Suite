# zcompute Bare Metal — LIFECYCLE debug config
#
# Same as bare_metal_debug.yaml (all our GB200 fixes: private_ip host
# overrides, expected_gpus: 4, expected_ports: 5, exclude list), except
# this one actually exercises stop/start/reboot/power-cycle/reinstall
# instead of skipping them.
#
# Requested by Ofir (2026-08-02) to check whether poweroff/reboot/reinstall
# now work correctly on zcompute bare-metal. IMPORTANT: do NOT point this
# at an existing/precious instance via ZCOMPUTE_BM_INSTANCE_ID — powering
# off a bare-metal instance was previously confirmed to actually DELETE it
# (2026-07-30), not stop/preserve it like a VM, and reinstall_instance.py's
# own docstring flags its root-volume-swap path as untested end-to-end on
# zcompute. Always run this against a fresh, disposable instance (leave
# ZCOMPUTE_BM_INSTANCE_ID/KEY_FILE unset so launch_instance creates a new
# one) so a destructive failure only costs a throwaway instance, not the
# golden one already recorded with NVIDIA (test run 372).
#
# No --lab-id on this run — exploratory only, not for upload.
#
# Usage:
#   export ZCOMPUTE_BASE_URL=https://<gb200-cluster-ip>
#   export AWS_ACCESS_KEY_ID=...
#   export AWS_SECRET_ACCESS_KEY=...
#   export AWS_REGION=symphony
#   export ZCOMPUTE_BM_AMI_ID=ami-3ce3727bebb54502b931a59e47e40877
#   export NGC_API_KEY=...                   # needed for deploy_nim to do anything
#   # do NOT set ZCOMPUTE_BM_INSTANCE_ID/KEY_FILE - this must launch fresh
#   PYTHONPATH=isvctl/src:isvtest/src:isvreporter/src \
#     uv run isvctl test run -f isvctl/configs/providers/zcompute/config/bare_metal_lifecycle_debug.yaml -v -s

import:
  - ./bare_metal.yaml

version: "1.0"

commands:
  bare_metal:
    phases: ["setup", "test", "teardown"]
    steps:
      - name: launch_instance
        phase: setup
        command: "python3 ../scripts/bare_metal/launch_instance.py"
        args:
          - "--name"
          - "isv-bm-test-gpu-lifecycle"
          - "--instance-type"
          - "{{instance_type}}"
          - "--region"
          - "{{region}}"
          - "--ami-id"
          - "{{ami_id}}"
          - "--vpc-id"
          - "{{vpc_id}}"
          - "--subnet-id"
          - "{{subnet_id}}"
        timeout: 5400

      - name: list_instances
        phase: test
        command: "python3 ../scripts/vm/list_instances.py"
        args:
          - "--vpc-id"
          - "{{steps.launch_instance.vpc_id}}"
          - "--instance-id"
          - "{{steps.launch_instance.instance_id}}"
          - "--region"
          - "{{region}}"
        timeout: 120

      - name: verify_tags
        phase: test
        command: "python3 ../scripts/bare_metal/describe_tags.py"
        args:
          - "--instance-id"
          - "{{steps.launch_instance.instance_id}}"
          - "--region"
          - "{{region}}"
        timeout: 60

      - name: topology_placement
        phase: test
        command: "python3 ../scripts/bare_metal/topology_placement.py"
        args:
          - "--instance-id"
          - "{{steps.launch_instance.instance_id}}"
          - "--region"
          - "{{region}}"
        timeout: 120
        continue_on_failure: true

      - name: serial_console
        phase: test
        command: "python3 ../scripts/bare_metal/serial_console.py"
        args:
          - "--instance-id"
          - "{{steps.launch_instance.instance_id}}"
          - "--region"
          - "{{region}}"
        timeout: 60
        continue_on_failure: true

      - name: verify_image
        phase: test
        command: "python3 ../scripts/image-registry/verify_image_installed.py"
        args:
          - "--instance-id"
          - "{{steps.launch_instance.instance_id}}"
          - "--region"
          - "{{region}}"
        timeout: 60

      - name: verify_config
        phase: test
        command: "python3 ../scripts/image-registry/verify_config_installable.py"
        args:
          - "--instance-id"
          - "{{steps.launch_instance.instance_id}}"
          - "--region"
          - "{{region}}"
        timeout: 60

      # Unskipped (unlike bare_metal_debug.yaml) - this is the whole point
      # of this config. Only ever run against a fresh, disposable instance.
      - name: stop_instance
        phase: test
        command: "python3 ../scripts/bare_metal/stop_instance.py"
        args:
          - "--instance-id"
          - "{{steps.launch_instance.instance_id}}"
          - "--region"
          - "{{region}}"
        timeout: 2100

      - name: start_instance
        phase: test
        command: "python3 ../scripts/bare_metal/start_instance.py"
        args:
          - "--instance-id"
          - "{{steps.launch_instance.instance_id}}"
          - "--region"
          - "{{region}}"
          - "--key-file"
          - "{{steps.launch_instance.key_file}}"
          - "--pre-start-delay"
          - "600"
        # Worst case (4 bounce-back retries): 600 pre-delay + 4*2700 poll +
        # 3*300 between-retry wait + 120 EIP wait + 1200 ssh wait = 13620s -
        # that's already over the old 13500s budget with zero margin left,
        # so bumped to give real headroom.
        timeout: 15000

      - name: reboot_instance
        phase: test
        command: "python3 ../scripts/bare_metal/reboot_instance.py"
        args:
          - "--instance-id"
          - "{{steps.launch_instance.instance_id}}"
          - "--region"
          - "{{region}}"
          - "--key-file"
          - "{{steps.launch_instance.key_file}}"
          - "--private-ip"
          - "{{steps.launch_instance.private_ip}}"
          - "--wait-before-check"
          - "180"
        timeout: 3600

      - name: power_cycle_instance
        phase: test
        command: "python3 ../scripts/bare_metal/power_cycle_instance.py"
        args:
          - "--instance-id"
          - "{{steps.launch_instance.instance_id}}"
          - "--region"
          - "{{region}}"
          - "--key-file"
          - "{{steps.launch_instance.key_file}}"
          - "--pre-start-delay"
          - "600"
        timeout: 16200

      - name: describe_instance
        phase: test
        command: "python3 ../scripts/bare_metal/describe_instance.py"
        args:
          - "--instance-id"
          - "{{steps.launch_instance.instance_id}}"
          - "--region"
          - "{{region}}"
          - "--key-file"
          - "{{steps.launch_instance.key_file}}"
        timeout: 120

      # Unskipped per Ofir's request - reinstall_instance.py's own docstring
      # flags this root-volume-swap path as untested end-to-end on zcompute,
      # so this run is exactly what verifies it for the first time. Fresh
      # disposable instance only.
      - name: reinstall_instance
        phase: test
        command: "python3 ../scripts/bare_metal/reinstall_instance.py"
        args:
          - "--instance-id"
          - "{{steps.launch_instance.instance_id}}"
          - "--region"
          - "{{region}}"
          - "--key-file"
          - "{{steps.launch_instance.key_file}}"
        # Internal budget (no retries even): 1800 stop poll + 300*3 volume
        # polls + 2700 start poll + 1200 ssh wait = 6600s - that's already
        # over the old 6000s timeout in a normal run, not just worst case.
        timeout: 8100

      - name: deploy_nim
        phase: test
        command: "python3 ../../shared/deploy_nim.py"
        args:
          - "--host"
          - "{{steps.launch_instance.private_ip}}"
          - "--key-file"
          - "{{steps.launch_instance.key_file}}"
        timeout: 7200

      # Teardown left skip:true - if a destructive step fails/behaves
      # unexpectedly, we want the instance left as-is to inspect, not
      # auto-cleaned. Tear down manually afterward once satisfied.
      - name: teardown_nim
        phase: teardown
        skip: true
        command: "python3 ../../shared/teardown_nim.py"
        args:
          - "--host"
          - "{{steps.launch_instance.private_ip}}"
          - "--key-file"
          - "{{steps.launch_instance.key_file}}"
        timeout: 120

      - name: teardown
        phase: teardown
        skip: true
        command: "python3 ../scripts/bare_metal/teardown.py"
        timeout: 3300
        args:
          - "--instance-id"
          - "{{steps.launch_instance.instance_id}}"
          - "--region"
          - "{{region}}"
          - "--eip-allocation-id"
          - "{{steps.launch_instance.eip_allocation_id}}"
          - "--delete-key-pair"
          - "--delete-security-group"
          - "{{teardown_flag}}"

      - name: verify_teardown
        phase: teardown
        skip: true
        command: "python3 ../scripts/bare_metal/verify_terminated.py"
        args:
          - "--instance-id"
          - "{{steps.launch_instance.instance_id}}"
          - "--region"
          - "{{region}}"
          - "--security-group-id"
          - "{{steps.launch_instance.security_group_id}}"
          - "--key-name"
          - "{{steps.launch_instance.key_name}}"
        timeout: 120

tests:
  cluster_name: "zcompute-bm-validation-lifecycle-debug"
  description: "zcompute Bare Metal (BMaaS) LIFECYCLE debug run — fresh instance, full stop/start/reboot/power-cycle/reinstall, no upload"

  exclude:
    markers: []
    # Same permanent platform gaps as bare_metal_debug.yaml.
    tests:
      - CloudInitCheck
      - SerialConsoleCheck
      - SerialConsoleRetentionCheck
      - TopologyPlacementCheck

  validations:
    gpu:
      step: describe_instance
      checks:
        GpuCheck:
          host: "{{steps.describe_instance.private_ip}}"
          key_file: "{{steps.describe_instance.key_file}}"
          expected_gpus: 4

    host_os:
      step: describe_instance
      checks:
        PciBusCheck:
          host: "{{steps.describe_instance.private_ip}}"
          key_file: "{{steps.describe_instance.key_file}}"
          expected_gpus: 4

    gpu_stress:
      step: describe_instance
      checks:
        GpuStressCheck:
          host: "{{steps.describe_instance.private_ip}}"
          key_file: "{{steps.describe_instance.key_file}}"
          runtime: 30
          memory_gb: 16

    nccl:
      step: describe_instance
      checks:
        NcclCheck:
          host: "{{steps.describe_instance.private_ip}}"
          key_file: "{{steps.describe_instance.key_file}}"

    training:
      step: describe_instance
      checks:
        TrainingCheck:
          host: "{{steps.describe_instance.private_ip}}"
          key_file: "{{steps.describe_instance.key_file}}"
          steps: 50

    nvlink:
      step: describe_instance
      checks:
        NvlinkCheck:
          host: "{{steps.describe_instance.private_ip}}"
          key_file: "{{steps.describe_instance.key_file}}"

    driver_info:
      step: describe_instance
      checks:
        DriverCheck:
          host: "{{steps.describe_instance.private_ip}}"
          key_file: "{{steps.describe_instance.key_file}}"

    infiniband:
      step: describe_instance
      checks:
        InfiniBandCheck:
          host: "{{steps.describe_instance.private_ip}}"
          key_file: "{{steps.describe_instance.key_file}}"
          expected_ports: 5

    cpu_info:
      step: describe_instance
      checks:
        CpuInfoCheck:
          host: "{{steps.describe_instance.private_ip}}"
          key_file: "{{steps.describe_instance.key_file}}"

    container_runtime:
      step: describe_instance
      checks:
        ContainerRuntimeCheck:
          host: "{{steps.describe_instance.private_ip}}"
          key_file: "{{steps.describe_instance.key_file}}"

    start_gpu:
      step: start_instance
      checks:
        GpuCheck:
          host: "{{steps.describe_instance.private_ip}}"
          key_file: "{{steps.describe_instance.key_file}}"
          expected_gpus: 4

    reboot_gpu:
      step: reboot_instance
      checks:
        GpuCheck:
          host: "{{steps.describe_instance.private_ip}}"
          key_file: "{{steps.describe_instance.key_file}}"
          expected_gpus: 4

    power_cycle_gpu:
      step: power_cycle_instance
      checks:
        GpuCheck:
          host: "{{steps.power_cycle_instance.private_ip}}"
          key_file: "{{steps.power_cycle_instance.key_file}}"
          expected_gpus: 4
